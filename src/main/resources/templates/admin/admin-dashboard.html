<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <script th:src="@{/js/theme.js}"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body>

<nav class="navbar navbar-expand-lg">
    <div class="container">
        <span class="navbar-brand">Admin Panel</span>

        <div class="d-flex gap-2">

            <a href="/logout" class="btn btn-outline-theme btn-sm">
                Logout
            </a>
        </div>
    </div>
</nav>

<div class="container mt-4">

    <h3>System Analytics</h3>

    <div class="row text-center mt-3">
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h6>Total Companies</h6>
                    <h2 th:text="${companies.size()}"></h2>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h6>Total Internships</h6>
                    <h2 th:text="${internships.size()}"></h2>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h6>Total Applications</h6>
                    <h2 th:text="${applications.size()}"></h2>
                </div>
            </div>
        </div>
    </div>

    <!-- COMPANY APPROVALS -->
    <h4 class="mt-5">Company Approvals</h4>

    <table class="table table-bordered mt-3">
        <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Status</th>
            <th>Action</th>
        </tr>

        <tr th:each="c : ${companies}">
            <td th:text="${c.name}"></td>
            <td th:text="${c.email}"></td>
            <td th:text="${c.approved ? 'Approved' : 'Pending'}"></td>
            <td>
                <form th:if="${!c.approved}"
                      th:action="@{/admin/company/{id}/approve(id=${c.id})}"
                      method="post">
                    <button class="btn btn-sm btn-success">
                        Approve
                    </button>
                </form>
            </td>
        </tr>
    </table>
    <h3>All Applications</h3>

    <table class="table table-bordered">
        <tr>
            <th>Student</th>
            <th>Company</th>
            <th>Internship</th>
            <th>Status</th>
        </tr>

        <tr th:each="a : ${applications}">
            <td th:text="${a.student.name}"></td>
            <td th:text="${a.internship.company.name}"></td>
            <td th:text="${a.internship.title}"></td>
            <td th:text="${a.status}"></td>
        </tr>
    </table>
    <!-- INTERNSHIP ALLOCATION -->
    <h4 class="mt-5">Internship Allocation</h4>

    <table class="table table-bordered mt-3">
        <tr>
            <th>Title</th>
            <th>Company</th>
            <th>Domain</th>
            <th>Slots</th>
            <th>Action</th>
        </tr>

        <tr th:each="i : ${internships}">
            <td th:text="${i.title}"></td>
            <td th:text="${i.company != null ? i.company.name : 'N/A'}"></td>
            <td th:text="${i.domain.name}"></td>
            <td th:text="${i.availableSlots}"></td>
            <td>
                <form th:action="@{/admin/internship/{id}/allocate(id=${i.id})}"
                      method="post">
                    <button class="btn btn-sm btn-danger">
                        Run Allocation
                    </button>
                </form>
            </td>
        </tr>
    </table>

</div>

</body>
</html>
