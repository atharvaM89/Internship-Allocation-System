<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Rejected Applications</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="container mt-4">

<h3 class="text-danger">Rejected Applications</h3>

<table class="table table-bordered mt-3">
    <tr>
        <th>Internship</th>
        <th>Company</th>
        <th>Score</th>
        <th>Status</th>
    </tr>

    <tr th:each="a : ${applications}">
        <td th:text="${a.internship.title}"></td>
        <td th:text="${a.internship.company.name}"></td>
        <td th:text="${a.score}"></td>
        <td class="status-REJECTED">REJECTED</td>
    </tr>
</table>

<a href="/student/dashboard" class="btn btn-secondary">Back</a>

</body>
</html>
