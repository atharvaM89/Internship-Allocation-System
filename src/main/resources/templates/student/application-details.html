<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Application Details</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="container mt-4">

<h3>Application Details</h3>

<div class="card shadow-sm mt-3">
    <div class="card-body">

        <p><b>Internship:</b> <span th:text="${application.internship.title}"></span></p>
        <p><b>Company:</b> <span th:text="${application.internship.company.name}"></span></p>
        <p><b>Status:</b>
            <span th:class="'status-' + ${application.status}"
                  th:text="${application.status}">
            </span>
        </p>
        <p><b>Score:</b> <span th:text="${application.score}"></span></p>

        <!-- WITHDRAW BUTTON -->
        <form th:if="${application.status.name() == 'APPLIED'}"
              th:action="@{/applications/withdraw/{id}(id=${application.id})}"
              method="post">

            <button class="btn btn-danger mt-2">
                Withdraw Application
            </button>
        </form>

    </div>
</div>

<a href="/student/applications" class="btn btn-secondary mt-3">Back</a>

</body>
</html>
