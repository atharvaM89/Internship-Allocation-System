<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Recommended Internships</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="container mt-4">

<h3>Recommended Internships</h3>

<div th:if="${internships.size() == 0}" class="alert alert-info">
    No recommendations yet. Complete your profile for better results.
</div>

<div class="row mt-3">
    <div class="col-md-4 mb-3" th:each="i : ${internships}">
        <div class="card shadow-sm h-100">
            <div class="card-body">
                <h5 th:text="${i.title}"></h5>
                <p th:text="${i.company.name}"></p>
                <p><b>Skills:</b> <span th:text="${i.requiredSkills}"></span></p>
                <a th:href="@{/internships/{id}(id=${i.id})}"
                   class="btn btn-success btn-sm">
                    View Details
                </a>
            </div>
        </div>
    </div>
</div>

<a href="/student/dashboard" class="btn btn-secondary mt-3">Back</a>

</body>
</html>
