<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Profile</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        .profile-card {
            border-radius: 16px;
            padding: 25px;
            background: #ffffff;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }
        .avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: #0d6efd;
            color: white;
            font-size: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: auto;
        }
    </style>
</head>

<body class="bg-light">

<div class="container mt-5" style="max-width: 900px">

    <div class="row">
        <!-- PROFILE CARD -->
        <div class="col-md-4">
            <div class="profile-card text-center">

                <div class="avatar"
                     th:text="${#strings.substring(student.name,0,1)}">
                </div>

                <h4 class="mt-3" th:text="${student.name}"></h4>
                <p class="text-muted" th:text="${student.email}"></p>

                <label class="fw-bold">Profile Completion</label>
                <div class="progress mt-2">
                    <div class="progress-bar bg-success"
                         th:style="'width:' + ${completion} + '%'">
                        <span th:text="${completion + '%'}"></span>
                    </div>
                </div>

                <a href="/student/dashboard" class="btn btn-outline-secondary mt-4 w-100">
                    Back to Dashboard
                </a>
            </div>
        </div>

        <!-- EDIT FORM -->
        <div class="col-md-8">
            <div class="profile-card">

                <h4>Edit Profile</h4>

                <p class="text-success" th:text="${success}"></p>

                <form method="post" action="/student/profile/update">

                    <div class="mb-3">
                        <label class="form-label">CGPA</label>
                        <input type="number" step="0.01"
                               name="cgpa"
                               th:value="${student.cgpa}"
                               class="form-control">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Branch</label>
                        <input name="branch"
                               th:value="${student.branch}"
                               class="form-control">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Skills</label>
                        <textarea name="skills"
                                  class="form-control"
                                  rows="3"
                                  placeholder="Java, Spring Boot, SQL"
                                  th:text="${student.skills}">
                        </textarea>
                    </div>

                    <button class="btn btn-primary">
                        Save Changes
                    </button>
                </form>

            </div>
        </div>
    </div>

</div>

</body>
</html>
