<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Student Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <script th:src="@{/js/theme.js}"></script>
</head>

<body>


<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand">Internship System</a>

        <div class="navbar-nav ms-auto align-items-center gap-2">

            <a class="nav-link" href="/student/dashboard">Dashboard</a>
            <a class="nav-link" href="/internships">Internships</a>
            <a class="nav-link" href="/student/applications">Applications</a>
            <a class="nav-link" href="/student/notifications">Notifications</a>

            <!-- 🌙 / ☀️ THEME TOGGLE -->
           

            <a class="nav-link text-warning ms-2" href="/logout">
                Logout
            </a>
        </div>
    </div>
</nav>

<div class="container mt-4">

    <h3>Student Dashboard</h3>

    <!-- STATS CARDS -->
    <div class="row mt-3">

        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body text-center">
                    <h6>Total Applications</h6>
                    <h2 th:text="${total}">0</h2>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body text-center text-success">
                    <h6>Selected</h6>
                    <h2 th:text="${selected}">0</h2>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body text-center text-info">
                    <h6>Profile Status</h6>
                    <h2 th:text="${profileStatus}">%</h2>
                </div>
            </div>
        </div>

    </div>

    <!-- QUICK LINKS -->
    <div class="list-group mt-4">
        <a href="/student/recommendations"
           class="list-group-item list-group-item-action">
            Recommended Internships
        </a>

        <a href="/student/analytics"
           class="list-group-item list-group-item-action">
            My Analytics
        </a>
        <a href="/internships" class="list-group-item list-group-item-action">
            View Available Internships
        </a>
        <a href="/student/applications" class="list-group-item list-group-item-action">
            My Applications
        </a>
        <a href="/student/selected" class="list-group-item list-group-item-action">
            Selected Internships
        </a>
        <a href="/student/rejected" class="list-group-item list-group-item-action">
            Rejected Applications
        </a>
        <a href="/student/profile" class="list-group-item list-group-item-action">
            My Profile
        </a>
    </div>

</div>

</body>
</html>
