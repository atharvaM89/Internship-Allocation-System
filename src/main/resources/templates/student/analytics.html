<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Analytics</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="container mt-4">

<h3>My Application Analytics</h3>

<div class="row mt-4">

    <div class="col-md-4">
        <div class="card shadow-sm text-center">
            <div class="card-body">
                <h6>Applied</h6>
                <h2 th:text="${applied}"></h2>
            </div>
        </div>
    </div>

    <div class="col-md-4">
        <div class="card shadow-sm text-center text-success">
            <div class="card-body">
                <h6>Selected</h6>
                <h2 th:text="${selected}"></h2>
            </div>
        </div>
    </div>

    <div class="col-md-4">
        <div class="card shadow-sm text-center text-danger">
            <div class="card-body">
                <h6>Rejected</h6>
                <h2 th:text="${rejected}"></h2>
            </div>
        </div>
    </div>

</div>

<a href="/student/dashboard" class="btn btn-secondary mt-4">Back</a>

</body>
</html>
