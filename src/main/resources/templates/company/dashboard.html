<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Company Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <script th:src="@{/js/theme.js}"></script>
</head>

<body>

<nav class="navbar">
    <div class="container">
        <span class="navbar-brand">Company Panel</span>

        <div class="d-flex gap-2">

            <a href="/logout" class="btn btn-outline-theme btn-sm">
                Logout
            </a>
        </div>
    </div>
</nav>

<div class="container mt-4">

    <div class="row text-center">
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h6>Total Internships</h6>
                    <h2 th:text="${totalInternships}"></h2>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h6>Total Applications</h6>
                    <h2 th:text="${totalApplications}"></h2>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body text-success">
                    <h6>Selected</h6>
                    <h2 th:text="${selected}"></h2>
                </div>
            </div>
        </div>
    </div>

    <h4 class="mt-5">My Internships</h4>

    <table class="table table-bordered mt-3">
        <tr>
            <th>Title</th>
            <th>Domain</th>
            <th>Slots</th>
            <th>Applicants</th>
        </tr>

        <tr th:each="i : ${internships}">
            <td th:text="${i.title}"></td>
            <td th:text="${i.domain.name}"></td>
            <td th:text="${i.availableSlots}"></td>
            <td>
                <a th:href="@{/company/internship/{id}/applications(id=${i.id})}"
                   class="btn btn-sm btn-primary">
                    View Applicants
                </a>
            </td>
        </tr>
    </table>

    <a href="/company/post" class="btn btn-success mt-3">
        + Post New Internship
    </a>

</div>

</body>
</html>
