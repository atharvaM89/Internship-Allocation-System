<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Post Internship</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-4">

<h3>Post New Internship</h3>

<p class="text-danger" th:text="${error}"></p>
<p class="text-success" th:text="${success}"></p>

<form method="post" action="/internships/add">

    <input name="title" class="form-control mb-2" placeholder="Title" required>
    <input name="description" class="form-control mb-2" placeholder="Description" required>
    <input name="minCgpa" type="number" step="0.1" class="form-control mb-2" placeholder="Minimum CGPA" required>
    <input name="requiredSkills" class="form-control mb-2" placeholder="Required Skills" required>
    <input name="allowedBranch" class="form-control mb-2" placeholder="Allowed Branch" required>
    <input name="totalSlots" type="number" class="form-control mb-2" placeholder="Total Slots" required>

    <select name="domainId" class="form-control mb-3" required>
        <option value="">Select Domain</option>
        <option th:each="d : ${domains}"
                th:value="${d.id}"
                th:text="${d.name}">
        </option>
    </select>

    <button class="btn btn-success">Post Internship</button>
</form>

<a href="/company/dashboard" class="btn btn-secondary mt-3">Back</a>

</body>
</html>
