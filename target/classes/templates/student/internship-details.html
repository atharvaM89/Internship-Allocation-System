<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Internship Details</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="container mt-4">

<h3 th:text="${internship.title}"></h3>

<div class="card shadow-sm mt-3">
    <div class="card-body">

        <p><b>Company:</b> <span th:text="${internship.company.name}"></span></p>
        <p><b>Description:</b> <span th:text="${internship.description}"></span></p>
        <p><b>Minimum CGPA:</b> <span th:text="${internship.minCgpa}"></span></p>
        <p><b>Required Skills:</b> <span th:text="${internship.requiredSkills}"></span></p>
        <p><b>Branch:</b> <span th:text="${internship.allowedBranch}"></span></p>
        <p><b>Available Slots:</b> <span th:text="${internship.availableSlots}"></span></p>

        <!-- APPLY BUTTON LOGIC -->
        <div class="mt-3">

            <form method="post" action="/applications/apply"
                  th:if="${eligible} and !${alreadyApplied}">
                <input type="hidden" name="internshipId"
                       th:value="${internship.id}">
                <button class="btn btn-success">
                    Apply Now
                </button>
            </form>

            <button class="btn btn-secondary"
                    disabled
                    th:if="${alreadyApplied}">
                Already Applied
            </button>

            <button class="btn btn-danger"
                    disabled
                    th:if="${!eligible}">
                Not Eligible
            </button>

        </div>

    </div>
</div>
<!-- APPLY FLOW -->

<div class="mt-3">

    <!-- View Roadmap First -->
    <a th:if="${eligible} and !${alreadyApplied}"
       th:href="@{/internships/{id}/roadmap(id=${internship.id})}"
       class="btn btn-success">
        View Roadmap & Apply
    </a>

    <button class="btn btn-secondary"
            disabled
            th:if="${alreadyApplied}">
        Already Applied
    </button>

    <button class="btn btn-danger"
            disabled
            th:if="${!eligible}">
        Not Eligible
    </button>

</div>

<a href="/internships" class="btn btn-secondary mt-3">Back</a>

</body>
</html>
